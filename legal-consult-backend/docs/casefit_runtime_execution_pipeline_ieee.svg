  <rect x="500" y="330" width="560" height="280" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.8" stroke-dasharray="8 7"/>
  <text class="label" x="780" y="360" text-anchor="middle" fill="#0f766e">Matching Components</text>
  <text class="sub" x="780" y="379" text-anchor="middle">queried in parallel before candidate ranking</text>
  <path class="arrow-soft dash" d="M735 260 V326"/>

  <!-- Component boxes -->
  <g filter="url(#shadow)">
    <rect x="528" y="402" width="118" height="56" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
    <rect x="662" y="402" width="118" height="56" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="796" y="402" width="118" height="56" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
    <rect x="930" y="402" width="100" height="56" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <rect x="528" y="488" width="118" height="56" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="662" y="488" width="118" height="56" rx="6" fill="#fce7f3" stroke="#db2777"/>
    <rect x="796" y="488" width="118" height="56" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
    <rect x="930" y="488" width="100" height="56" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  </g>

  <text class="small" x="587" y="425" text-anchor="middle">Availability</text>
  <text class="sub" x="587" y="442" text-anchor="middle">slots store</text>
  <text class="small" x="721" y="425" text-anchor="middle">Profiles</text>
  <text class="sub" x="721" y="442" text-anchor="middle">lawyer DB</text>
  <text class="small" x="855" y="425" text-anchor="middle">Expertise</text>
  <text class="sub" x="855" y="442" text-anchor="middle">scoring</text>
  <text class="small" x="980" y="425" text-anchor="middle">Workload</text>
  <text class="sub" x="980" y="442" text-anchor="middle">active cases</text>

  <text class="small" x="587" y="511" text-anchor="middle">Rating</text>
  <text class="sub" x="587" y="528" text-anchor="middle">quality score</text>
  <text class="small" x="721" y="511" text-anchor="middle">Location</text>
  <text class="sub" x="721" y="528" text-anchor="middle">geo rank</text>
  <text class="small" x="855" y="511" text-anchor="middle">Response Time</text>
  <text class="sub" x="855" y="528" text-anchor="middle">predictor</text>
  <text class="small" x="980" y="511" text-anchor="middle">Redis</text>
  <text class="sub" x="980" y="528" text-anchor="middle">hot cache</text>

  <!-- Database cylinder hint inside matching group -->
  <g>
    <ellipse cx="780" cy="583" rx="112" ry="16" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="668" y="583" width="224" height="34" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <ellipse cx="780" cy="617" rx="112" ry="16" fill="#99f6e4" stroke="#0f766e" stroke-width="1.5"/>
    <text class="small" x="780" y="607" text-anchor="middle">lawyer/request feature data</text>
  </g>

  <!-- Accept/reject labels and loop -->
  <text class="small" x="1268" y="211" fill="#15803d">accept</text>
  <text class="small" x="1190" y="302" text-anchor="middle" fill="#dc2626">reject</text>
  <path class="arrow-red" d="M1190 270 V304 H735 V264"/>

  <!-- Fulfillment second row -->
  <g filter="url(#shadow)">
    <rect class="block" x="1292" y="342" width="142" height="70" fill="#fef3c7" stroke="#d97706"/>
    <rect class="block" x="1456" y="342" width="150" height="70" fill="#dcfce7" stroke="#16a34a"/>
    <rect class="block" x="1628" y="342" width="118" height="70" fill="#f8fafc" stroke="#64748b"/>
  </g>
  <text class="label" x="1363" y="368" text-anchor="middle">Status Update</text>
  <text class="label" x="1363" y="386" text-anchor="middle">Service</text>
  <text class="sub" x="1363" y="402" text-anchor="middle">timeline event</text>

  <text class="label" x="1531" y="368" text-anchor="middle">User</text>
  <text class="label" x="1531" y="386" text-anchor="middle">Notification</text>
  <text class="sub" x="1531" y="402" text-anchor="middle">push / SMS</text>

  <text class="label" x="1687" y="368" text-anchor="middle">Request</text>
  <text class="label" x="1687" y="386" text-anchor="middle">Completed</text>
  <text class="sub" x="1687" y="402" text-anchor="middle">closed lifecycle</text>

  <path class="arrow" d="M1687 260 V316 H1363 V338"/>
  <path class="arrow" d="M1434 377 H1452"/>
  <path class="arrow" d="M1606 377 H1624"/>

  <!-- External integration callouts -->
  <rect x="1266" y="496" width="450" height="92" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="8 6"/>
  <text class="label" x="1491" y="523" text-anchor="middle">External Runtime Integrations</text>
  <text class="sub" x="1491" y="546" text-anchor="middle">payment gateway verification · OTP/SMS/email notification providers · admin workflow events</text>
  <path class="arrow-soft dash" d="M1531 412 V492"/>

  <!-- Footer -->
  <text class="legend" x="900" y="674" text-anchor="middle">Technical Design Doc: AI Lawyer Allocation Platform</text>
</svg>
