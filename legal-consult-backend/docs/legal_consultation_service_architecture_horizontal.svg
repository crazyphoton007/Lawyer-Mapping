<svg width="1500" height="520" viewBox="0 0 1500 520" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Legal consultation platform service architecture</title>
  <desc>Horizontal service architecture diagram for a legal consultation platform.</desc>

  <defs>
    <style>
      .page { fill: #ffffff; }
      .frame { fill: none; stroke: #cbd5e1; stroke-width: 2; }
      .titleBox { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .title { font: 700 18px Arial, Helvetica, sans-serif; fill: #111827; }
      .phase { font: 700 10px Arial, Helvetica, sans-serif; letter-spacing: .7px; fill: #475569; }
      .label { font: 700 15px Arial, Helvetica, sans-serif; fill: #111827; }
      .sub { font: 400 11px Arial, Helvetica, sans-serif; fill: #64748b; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .softArrow { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 6; }
      .icon { fill: none; stroke: #fff; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-15%" y="-25%" width="130%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect class="page" x="0" y="0" width="1500" height="520"/>
  <rect class="frame" x="18" y="18" width="1464" height="484" rx="8"/>

  <rect class="titleBox" x="470" y="34" width="560" height="34" rx="6"/>
  <text class="title" x="750" y="57" text-anchor="middle">Legal Consultation Platform - Service Architecture</text>

  <!-- Phase labels -->
  <rect x="70" y="92" width="236" height="28" rx="14" fill="#fee2e2"/>
  <rect x="350" y="92" width="236" height="28" rx="14" fill="#ede9fe"/>
  <rect x="630" y="92" width="350" height="28" rx="14" fill="#ecfdf5"/>
  <rect x="1024" y="92" width="206" height="28" rx="14" fill="#fdf2f8"/>
  <rect x="1268" y="92" width="162" height="28" rx="14" fill="#fef3c7"/>
  <text class="phase" x="188" y="111" text-anchor="middle">CLIENT LAYER</text>
  <text class="phase" x="468" y="111" text-anchor="middle">API LAYER</text>
  <text class="phase" x="805" y="111" text-anchor="middle">CORE SERVICES</text>
  <text class="phase" x="1127" y="111" text-anchor="middle">DATA LAYER</text>
  <text class="phase" x="1349" y="111" text-anchor="middle">OPERATIONS</text>

  <!-- Main cards -->
  <g filter="url(#shadow)">
    <rect x="90" y="195" width="168" height="146" rx="12" fill="#fff1f2" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="370" y="195" width="168" height="146" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>

    <rect x="664" y="144" width="224" height="78" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="664" y="236" width="224" height="78" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="664" y="328" width="224" height="78" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>

    <rect x="1050" y="195" width="168" height="146" rx="12" fill="#fdf2f8" stroke="#be185d" stroke-width="1.5"/>
    <rect x="1284" y="195" width="168" height="146" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  </g>

  <!-- Icon squares -->
  <g filter="url(#shadow)">
    <rect x="133" y="215" width="82" height="82" rx="16" fill="#ef4444"/>
    <rect x="413" y="215" width="82" height="82" rx="16" fill="#7c3aed"/>
    <rect x="686" y="158" width="50" height="50" rx="10" fill="#2563eb"/>
    <rect x="686" y="250" width="50" height="50" rx="10" fill="#16a34a"/>
    <rect x="686" y="342" width="50" height="50" rx="10" fill="#4f46e5"/>
    <rect x="1327" y="215" width="82" height="82" rx="16" fill="#d97706"/>
  </g>

  <!-- Icons -->
  <g>
    <rect class="icon" x="163" y="230" width="22" height="38" rx="4"/>
    <path class="icon" d="M169 261h10"/>

    <path class="icon" d="M435 256h38v26h-38z"/>
    <path class="icon" d="M443 256v-10c0-7 5-12 11-12s11 5 11 12v10"/>
    <path class="icon" d="M454 267v4"/>

    <path class="icon" d="M700 186h22v16h-22z"/>
    <path class="icon" d="M705 186v-7c0-5 4-8 6-8s6 3 6 8v7"/>

    <path class="icon" d="M699 263h24v24h-24z"/>
    <path class="icon" d="M704 272h14M704 281h9"/>

    <circle class="icon" cx="711" cy="362" r="10"/>
    <path class="icon" d="M719 370l10 10M707 362h8M711 358v8"/>

    <path class="icon" d="M1351 236h46v34h-46z"/>
    <path class="icon" d="M1360 247h11M1360 258h11M1381 247h8M1381 258h8"/>
  </g>

  <!-- Text labels -->
  <text class="label" x="174" y="319" text-anchor="middle">Mobile App</text>
  <text class="sub" x="174" y="338" text-anchor="middle">React Native / Expo</text>

  <text class="label" x="454" y="319" text-anchor="middle">API Gateway</text>
  <text class="sub" x="454" y="338" text-anchor="middle">FastAPI backend</text>

  <text class="label" x="812" y="176" text-anchor="middle">Auth Service</text>
  <text class="sub" x="812" y="195" text-anchor="middle">OTP login, JWT tokens, user profile</text>

  <text class="label" x="820" y="268" text-anchor="middle">Payment Service</text>
  <text class="sub" x="820" y="287" text-anchor="middle">payment link, gateway verification</text>

  <text class="label" x="820" y="360" text-anchor="middle">Matching Engine</text>
  <text class="sub" x="820" y="379" text-anchor="middle">lawyer ranking and allocation</text>

  <text class="label" x="1178" y="254" text-anchor="middle">PostgreSQL</text>
  <text class="sub" x="1178" y="274" text-anchor="middle">primary relational datastore</text>

  <text class="label" x="1368" y="319" text-anchor="middle">Admin Panel</text>
  <text class="sub" x="1368" y="338" text-anchor="middle">operations dashboard</text>

  <!-- Database cylinder -->
  <g>
    <ellipse cx="1105" cy="248" rx="34" ry="9" fill="#be185d" opacity=".92"/>
    <rect x="1071" y="248" width="68" height="38" fill="#be185d" opacity=".92"/>
    <ellipse cx="1105" cy="286" rx="34" ry="9" fill="#db2777" opacity=".92"/>
    <path d="M1071 248v38M1139 248v38" stroke="#be185d" stroke-width="1"/>
  </g>

  <!-- Straight, non-overlapping arrows -->
  <path class="arrow" d="M258 268 H366"/>
  <path class="arrow" d="M538 268 H612 V183 H660"/>
  <path class="arrow" d="M612 268 H660"/>
  <path class="arrow" d="M612 268 V367 H660"/>

  <path class="arrow" d="M888 183 H1018 V250 H1046"/>
  <path class="arrow" d="M888 275 H1046"/>
  <path class="arrow" d="M888 367 H1018 V286 H1046"/>

  <path class="arrow" d="M1218 268 H1280"/>
  <path class="softArrow dash" d="M1284 235 H1248 V134 H454 V191"/>
  <text class="sub" x="1020" y="148" text-anchor="middle">admin API calls</text>

  <!-- Data note -->
  <rect x="604" y="442" width="610" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="7 6"/>
  <text class="sub" x="909" y="464" text-anchor="middle">
    Stores users, lawyers, requests, payments, appointments, articles, feedback, and allocation features
  </text>
</svg>
